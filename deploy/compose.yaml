services:
  server:
    image: together-server:${RELEASE_TAG:-candidate}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      PORT: "3001"
      CLIENT_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      ALLOW_DEV_AUTH: "false"
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set server-only service role}
      SUPABASE_MEMORY_BUCKET: ${SUPABASE_MEMORY_BUCKET:-together-memories}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:?Set TURN_URL}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set server-only TURN secret}
      TURN_TTL_SECONDS: "3600"
      LOG_LEVEL: info
      API_RATE_LIMIT_PER_MINUTE: "240"
      SHUTDOWN_TIMEOUT_MS: "10000"
    expose:
      - "3001"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: together-web:${RELEASE_TAG:-candidate}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set public anon key}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  migrate:
    image: together-server:${RELEASE_TAG:-candidate}
    profiles: [operations]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    command: [node, server/dist/db/migrate.js]
volumes:
  caddy_data:
  caddy_config:
