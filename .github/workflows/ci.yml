name: CI

on:
  push:
    branches:
      - build/amaya-bay-v1
      - fix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate content
        run: pnpm validate

      - name: Validate repository
        run: pnpm validate:repo

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @together/client exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: client/test-results
          if-no-files-found: ignore
          retention-days: 14

  container-candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.yaml config --quiet

      - name: Build server and web candidates without deployment credentials
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.yaml build server web

      - name: Verify packaged server dependencies and migrations
        run: |
          docker run --rm together-server:candidate node --input-type=module -e "await import('./server/dist/app.js'); await import('@together/shared'); await import('@together/content'); const fs = await import('node:fs'); if (!fs.existsSync('server/dist/db/migrate.js') || fs.readdirSync('server/dist/db/migrations').filter(name => name.endsWith('.sql')).length === 0) process.exit(1);"

      - name: Validate packaged HTTPS and proxy configuration
        run: docker run --rm -e SITE_DOMAIN=game.example.com -e TLS_EMAIL=ops@example.com together-web:candidate caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
